project_name: "Face Liveness Detection"

paths:
  raw_data: "data/raw/"
  frames: "data/frames/"
  processed_rgb: "data/processed/rgb/"
  processed_fft: "data/processed/fft/"
  splits: "data/splits/"
  models: "models/"

preprocessing:
  target_size: [224, 224]
  margin_ratio: 0.15
  frame_skip: 5

training:
  batch_size: 32
  learning_rate: 0.001
  epochs: 50
  input_channels: 3
  threshold: 0.5